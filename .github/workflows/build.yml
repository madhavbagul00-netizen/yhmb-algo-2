name: Build YHMB APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Marathi font
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-core
          F=$(find /usr/share/fonts -name 'NotoSansDevanagari-Regular.ttf' | head -1)
          test -n "$F" && mkdir -p assets && cp "$F" assets/font.ttf
      - name: Build APK
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable
      - uses: actions/upload-artifact@v4
        with:
          name: YHMB-ALGO-APP-apk
          path: bin/*.apk
